<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI nhóm hỗ trợ Nam Định</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Điều hướng chính">

    <button class="btn mark side-cta" type="button" id="cta">＋ Nhập KPI hôm nay</button>
    <nav id="nav" class="side-nav" aria-label="Mục"></nav>
    <div class="side-foot sync-slot"></div>
  </aside>
  <div class="content">
    <header class="topbar">
      <div class="logo m-logo" aria-hidden="true">KPI</div>
      <div class="tb-title"><div class="eyebrow" id="eyebrow"></div><h1 id="page-title">Tổng quan tuần</h1></div>
      <div class="sync-slot m-sync"></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Mục chính"></nav>
<button class="btn mark fab" type="button" id="fab" aria-label="Nhập KPI hôm nay">＋ Nhập KPI</button>
<script src="config.js"></script>
<script src="app.js"></script>
