<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI nhóm hỗ trợ Nam Định</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section class="auth-screen" id="auth-screen" aria-labelledby="auth-title">
  <div class="auth-card">
    <div class="auth-brand"><div class="logo" aria-hidden="true">KPI</div><div><div class="b-name">EasySupport</div><div class="b-sub">Báo cáo KPI nhóm</div></div></div>
    <h1 id="auth-title">Đăng nhập</h1>
    <p class="auth-intro">Đăng nhập để xem báo cáo KPI của nhóm.</p>
    <form id="auth-form">
      <label class="field" for="auth-email">Email
        <input id="auth-email" name="email" type="email" autocomplete="username" required>
      </label>
      <label class="field" for="auth-password">Mật khẩu
        <input id="auth-password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="auth-message" id="auth-message" role="alert" hidden></p>
      <button class="btn auth-submit" id="auth-submit" type="submit">Đăng nhập</button>
    </form>
  </div>
</section>
<div class="shell" id="app-shell" hidden>
  <aside class="side" aria-label="Điều hướng chính">
    <div class="brand"><div class="logo" aria-hidden="true">KPI</div><div><div class="b-name">EasySupport</div><div class="b-sub">Báo cáo KPI nhóm</div></div></div>
    <button class="btn mark side-cta" type="button" id="cta">＋ Nhập KPI hôm nay</button>
    <nav id="nav" class="side-nav" aria-label="Mục"></nav>
    <div class="side-foot sync-slot"></div>
  </aside>
  <div class="content">
    <header class="topbar">
      <div class="logo m-logo" aria-hidden="true">KPI</div>
      <div class="tb-title"><div class="eyebrow" id="eyebrow"></div><h1 id="page-title">Tổng quan tuần</h1></div>
      <div class="sync-slot m-sync"></div>
      <div class="account-controls" id="account-controls" hidden><span id="account-email"></span><button class="ghost" id="sign-out" type="button">Đăng xuất</button></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Mục chính" hidden></nav>
<button class="btn mark fab" type="button" id="fab" aria-label="Nhập KPI hôm nay" hidden>＋ Nhập KPI</button>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
